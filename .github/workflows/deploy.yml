name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p dist/server
          find dist -mindepth 1 -maxdepth 1 -not -name server -exec cp -r {} dist/server/ \;
          # Copy wrangler config with main entry point
          cp wrangler.toml dist/server/wrangler.toml
          echo 'main = "_worker.js"' >> dist/server/wrangler.toml

      - name: Deploy
        working-directory: dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
